apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: satefulset-demo
spec:
  serviceName: "satefulset-demo"
  replicas: 2
  selector:
    matchLabels:
      app: satefulset-demo
  template:
    metadata:
      labels:
        app: satefulset-demo
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80