apiVersion: v1
kind: Pod
metadata:
  name: roboshop-frontend
  labels:
    app: roboshop-frontend
spec:
  containers:
    - name: roboshop-frontend
      image: burlash.azurecr.io/frontend:latest
      imagePullPolicy: Always
  
---
apiVersion: v1
kind: Service
metadata:
  name: roboshop-frontend
spec:
  type: LoadBalancer
  selector:
    app: roboshop-frontend
  ports:
    - protocol: TCP
      port: 80 # Service Port
      targetPort: 80 # Container Port
---
apiVersion: v1
kind: Pod
metadata:
  name: roboshop-catalogue
  labels:
    app: roboshop-catalogue
spec:
  containers:
    - name: roboshop-catalogue
      image: burlash.azurecr.io/catalogue:latest
      imagePullPolicy: Always
      envFrom:
        - configMapRef:
            name: roboshop-catalogue
  
---
apiVersion: v1
kind: Service
metadata:
  name: roboshop-catalogue
spec:
  selector:
    app: roboshop-catalogue
  ports:
    - protocol: TCP
      port: 8002 # Service Port
      targetPort: 8002 # Container Port
---
