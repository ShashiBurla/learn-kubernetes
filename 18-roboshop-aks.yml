apiVersion: v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  Replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: burlash.azurecr.io/frontend:latest
          imagePullPolicy: Always
          
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80 # Service Port
      targetPort: 80 # Container Port
---
apiVersion: v1
kind: Deployment
metadata:
