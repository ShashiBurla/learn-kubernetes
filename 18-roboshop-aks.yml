---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cart
data:
  REDIS_HOST : valkey-dev.shashidevops.online
  CATALOGUE_URL : http://catalogue:8002
  PORT : "8003"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
data:
  MYSQL_HOST : mysql-dev.shashidevops.online
  MYSQL_USER : catalogue
  MYSQL_PASSWORD : RoboShop@1
  MYSQL_ROOT_PASSWORD : RoboShop@1
  MYSQL_DATABASE : catalogue
  PORT : "8002"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user
data:
  MONGO_URL : mongodb://mongodb-dev.shashidevops.online:27017/users
  JWT_SECRET : secret-key
  PORT : "8001"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shipping
data:
  DB_HOST : mysql-dev.shashidevops.online
  DB_USER : shipping
  DB_PASS : RoboShop@1
  MYSQL_ROOT_PASSWORD : RoboShop@1
  PORT : "8004"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment
data:
  AMQP_HOST : rabbitmq-dev.shashidevops.online
  AMQP_USER : roboshop
  AMQP_PASS : RoboShop@1
  CART_URL : http://cart:8003
  USER_URL : http://user:8001
  PORT : "8005"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders
data:
  MONGO_URL : mongodb://mongodb-dev.shashidevops.online:27017/orders
  AMQP_HOST : rabbitmq-dev.shashidevops.online
  AMQP_USER : roboshop
  AMQP_PASS : RoboShop@1
  SHIPPING_URL : http://shipping:8004
  NOTIFICATION_URL : http://localhost:8008
  PORT : "8007"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ratings
data:
  MYSQL_HOST : mysql-dev.shashidevops.online
  MYSQL_USER : ratings
  MYSQL_PASSWORD : RoboShop@1
  MYSQL_ROOT_PASSWORD : RoboShop@1
  MYSQL_DATABASE : ratings
  PORT : "8006"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: catalogue-db
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: catalogue-db
        image: burlash.azurecr.io/catalogue-db
        imagePullPolicy: Always
        envFrom:
          - configMapRef:
              name: catalogue

