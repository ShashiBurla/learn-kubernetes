## In this example, container will be up, But nginx wont be available for few seconds.
apiVersion: v1
kind: Pod
metadata:
  name: probe-delay-nginx
spec:
  containers:
  - name: nginx
    image: rkalluru/delay-nginx
    imagePullPolicy: Always

---
apiVersion: v1
kind: Pod
metadata:
  name: liveness-probe-startup-probe
spec:
  containers:
  - name: nginx
    image: rkalluru/delay-nginx
    imagePullPolicy: Always
    startupProbe:
      tcpSocket:
        port: 80
      initialDelaySeconds: 15
      periodSeconds: 10
      failureThreshold: 10
    livenessProbe:
      tcpSocket:
        port: 80
      initialDelaySeconds: 110
      periodSeconds: 10
      failureThreshold: 2

---
apiVersion: v1
kind: Pod
metadata:
  name: readiness-probe
spec:
  containers:
  - name: nginx
    image: rkalluru/delay-nginx
    imagePullPolicy: Always
    readinessProbe:
      tcpSocket:
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
      successThreshold: 1

---
apiVersion: v1
kind: Pod
metadata:
  name: liveness-probe-http
spec:
  containers:
  - name: nginx
    image: rkalluru/delay-nginx
    imagePullPolicy: Always
    livenessProbe:
      exec:
        command:
        - cat
        - /tmp/healthy
      initialDelaySeconds: 62
      periodSeconds: 5
      failureThreshold: 2